services:
  - type: web
    name: sasi-job-application-agent
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -U pip setuptools wheel && pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: python agent.py --ui --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8000
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: RESUME_THEME
        value: tech
      - key: HEADLESS
        value: "true"
