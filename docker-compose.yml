version: "3.8"

services:
  # Master Job Application Agent (Web Dashboard, 28-Platform Scraper, Matcher & Telegram Bot)
  job-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-application-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - HEADLESS=true
      - DRY_RUN=true
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:3b-instruct
      - MIN_MATCH_SCORE=70
      - TELEGRAM_MIN_SCORE=80
    env_file:
      - .env
    volumes:
      # Persistent SQLite database, logs, and generated resumes across container restarts
      - ./data:/app/data
    depends_on:
      - ollama
    networks:
      - agent-network

  # Local Ollama AI Engine (Runs locally inside Oracle Cloud VM with 0 API costs)
  ollama:
    image: ollama/ollama:latest
    container_name: agent-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - agent-network

volumes:
  ollama_models:
    name: agent_ollama_models

networks:
  agent-network:
    name: job_agent_network
    driver: bridge
